services:
  # ── Backend Express API Web Service ─────────────────────────────────────────
  - type: web
    name: taskflow-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: EMAIL_FROM
        value: TaskFlow <brexcel14@gmail.com>

databases:
  # ── PostgreSQL Managed Database ─────────────────────────────────────────────
  - name: taskflow-db
    plan: free
    databaseName: taskflow
    user: taskflow_user
